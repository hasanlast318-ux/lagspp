        // ===================== مكون سجل الأعطال =====================
        const CrashLogsTab = () => {
            const [crashes, setCrashes] = React.useState([]);
            const [selectedCrash, setSelectedCrash] = React.useState(null);
            const [selectedDeviceIndex, setSelectedDeviceIndex] = React.useState(0);
            const [selectedUserIndex, setSelectedUserIndex] = React.useState(-1);
            const [selectedCrashIds, setSelectedCrashIds] = React.useState([]);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterStatus, setFilterStatus] = React.useState('all');
            const [filterErrorType, setFilterErrorType] = React.useState('all');
            const [filterDevice, setFilterDevice] = React.useState('all');
            const [sortBy, setSortBy] = React.useState('lastSeen');
            const [currentPage, setCurrentPage] = React.useState(1);
            const [editingStatus, setEditingStatus] = React.useState(null);
            const itemsPerPage = 10;

            // قراءة البيانات الحقيقية من Firebase
            React.useEffect(() => {
                if (!db) {
                    console.warn('Firebase not configured');
                    return;
                }

                const unsubscribe = db.collection('crashes').onSnapshot((snapshot) => {
                    const crashesData = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        crashesData.push({
                            docId: doc.id,
                            id: data.id !== undefined ? data.id : doc.id,
                            userId: data.userId || 'Unknown User',
                            errorType: data.errorType || 'Unknown Error',
                            screen: data.screen || 'Unknown Screen',
                            file: data.file || 'Unknown File',
                            line: data.line || 0,
                            usersAffected: data.usersAffected || 1,
                            appVersion: data.appVersion || 'Unknown',
                            androidVersion: data.androidVersion || 'Unknown',
                            devices: Array.isArray(data.devices) ? data.devices : [],
                            firstSeen: data.firstSeen || new Date().toISOString().split('T')[0],
                            lastSeen: data.lastSeen || new Date().toISOString().split('T')[0],
                            status: data.status || 'open',
                            lessonName: data.lessonName || null,
                            userCountry: data.userCountry || 'Unknown',
                            userProvince: data.userProvince || 'Unknown',
                            connectionType: data.connectionType || 'Unknown',
                            screenDimensions: data.screenDimensions || 'Unknown',
                            screenInch: data.screenInch || 'Unknown',
                            screenDp: data.screenDp || 'Unknown',
                            screenDpi: data.screenDpi || 'Unknown',
                            crashTime: data.crashTime || '00:00:00',
                            affectedUsers: Array.isArray(data.affectedUsers) ? data.affectedUsers : []
                        });
                    });
                    
                    crashesData.sort((a, b) => new Date(b.lastSeen) - new Date(a.lastSeen));
                    setCrashes(crashesData);
                }, (error) => {
                    console.error('❌ خطأ في تحميل بيانات الأعطال:', error);
                    setCrashes([]);
                });

                return () => unsubscribe();
            }, []);

            // الإحصائيات
            const totalCrashes = crashes.length;
            const todayCrashes = crashes.filter(c => c.lastSeen === '2026-06-11').length;
            const totalAffectedUsers = new Set(crashes.flatMap(c => c.devices)).size;
            const topPage = crashes.reduce((a, b) => b.usersAffected > a.usersAffected ? b : a, crashes[0] || {});

            // البحث والفلترة
            const filtered = crashes.filter(c => {
                const matchSearch = !searchTerm || 
                    c.errorType.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    c.screen.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    c.file.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (c.id && c.id.toString().includes(searchTerm));
                const matchStatus = filterStatus === 'all' || c.status === filterStatus;
                const matchError = filterErrorType === 'all' || c.errorType === filterErrorType;
                const matchDevice = filterDevice === 'all' || c.devices.includes(filterDevice);
                return matchSearch && matchStatus && matchError && matchDevice;
            });

            // الترتيب
            const sorted = [...filtered].sort((a, b) => {
                if (sortBy === 'lastSeen') return new Date(b.lastSeen) - new Date(a.lastSeen);
                if (sortBy === 'affected') return b.usersAffected - a.usersAffected;
                if (sortBy === 'firstSeen') return new Date(b.firstSeen) - new Date(a.firstSeen);
                return 0;
            });

            // الصفحات
            const totalPages = Math.ceil(sorted.length / itemsPerPage);
            const paginatedData = sorted.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            // الألوان حسب الحالة
            const getStatusColor = (status) => {
                if (status === 'open') return { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-700', badge: 'from-red-500 to-red-600' };
                if (status === 'fixed') return { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', badge: 'from-emerald-500 to-emerald-600' };
                if (status === 'investigating') return { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-700', badge: 'from-amber-500 to-amber-600' };
                if (status === 'closed') return { bg: 'bg-gray-50', border: 'border-gray-200', text: 'text-gray-700', badge: 'from-gray-500 to-gray-600' };
                return { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-700', badge: 'from-red-500 to-red-600' };
            };

            const getStatusLabel = (status) => {
                if (status === 'open') return '🔴 مفتوح';
                if (status === 'fixed') return '✅ مصلح';
                if (status === 'investigating') return '🔍 قيد التحقيق';
                if (status === 'closed') return '⚪ مغلق';
                return '🔴 مفتوح';
            };

            // تحديث حالة الخطأ (محلياً وفي Firebase مباشرة)
            const updateCrashStatus = (crashKey, newStatus) => {
                const keyStr = crashKey.toString();
                
                setCrashes(prev => prev.map(c => {
                    const cKey = (c.docId || c.id).toString();
                    return cKey === keyStr ? { ...c, status: newStatus } : c;
                }));

                if (selectedCrash) {
                    const sKey = (selectedCrash.docId || selectedCrash.id).toString();
                    if (sKey === keyStr) {
                        setSelectedCrash(prev => ({ ...prev, status: newStatus }));
                    }
                }

                if (db) {
                    db.collection('crashes').doc(keyStr).set({
                        status: newStatus
                    }, { merge: true }).catch(error => {
                        console.error('❌ خطأ في تحديث الحالة:', error);
                    });
                }
            };

            // تحديد / إلغاء تحديد الأعطال
            const toggleSelectCrash = (crashKey) => {
                const keyStr = crashKey.toString();
                setSelectedCrashIds(prev => 
                    prev.includes(keyStr) ? prev.filter(id => id !== keyStr) : [...prev, keyStr]
                );
            };

            const toggleSelectAll = () => {
                const visibleKeys = paginatedData.map(c => (c.docId || c.id).toString());
                const allSelected = visibleKeys.length > 0 && visibleKeys.every(k => selectedCrashIds.includes(k));
                if (allSelected) {
                    setSelectedCrashIds(prev => prev.filter(id => !visibleKeys.includes(id)));
                } else {
                    setSelectedCrashIds(prev => Array.from(new Set([...prev, ...visibleKeys])));
                }
            };

            // حذف الأعطال (مفرد أو متعدد)
            const deleteCrashes = async (crashKeysToDelete) => {
                if (!crashKeysToDelete || crashKeysToDelete.length === 0) return;
                
                const count = crashKeysToDelete.length;
                const confirmMsg = count === 1 
                    ? 'هل أنت متأكد من حذف هذا العطل؟' 
                    : `هل أنت متأكد من حذف الأعطال المحددة (${count})؟`;
                    
                if (!window.confirm(confirmMsg)) return;

                const keysStr = crashKeysToDelete.map(k => k.toString());

                // تحديث الواجهة فوراً
                setCrashes(prev => prev.filter(c => !keysStr.includes((c.docId || c.id).toString())));
                setSelectedCrashIds(prev => prev.filter(id => !keysStr.includes(id)));
                
                if (selectedCrash && keysStr.includes((selectedCrash.docId || selectedCrash.id).toString())) {
                    setSelectedCrash(null);
                }

                // الحذف من Firebase
                if (db) {
                    try {
                        const batch = db.batch ? db.batch() : null;
                        if (batch) {
                            keysStr.forEach(docId => {
                                batch.delete(db.collection('crashes').doc(docId));
                            });
                            await batch.commit();
                        } else {
                            await Promise.all(keysStr.map(docId => 
                                db.collection('crashes').doc(docId).delete()
                            ));
                        }
                    } catch (err) {
                        console.error('❌ خطأ في حذف الأعطال من Firebase:', err);
                        alert('حدث خطأ أثناء الحذف من قاعدة البيانات: ' + err.message);
                    }
                }
            };

            // إعادة تعيين الاختيارات عند تغيير العطل المختار
            React.useEffect(() => {
                setSelectedDeviceIndex(0);
                setSelectedUserIndex(-1);
            }, [selectedCrash]);

            const getSelectedUserData = () => {
                if (!selectedCrash) return null;
                if (selectedUserIndex >= 0 && selectedUserIndex < selectedCrash.affectedUsers.length) {
                    const user = selectedCrash.affectedUsers[selectedUserIndex];
                    return {
                        name: user.name || 'Unknown',
                        userId: user.id || 'Unknown',
                        userCountry: user.userCountry || selectedCrash.userCountry || 'Unknown',
                        userProvince: user.userProvince || selectedCrash.userProvince || 'Unknown',
                        connectionType: user.connectionType || selectedCrash.connectionType || 'Unknown'
                    };
                }
                return {
                    name: 'Unknown',
                    userId: selectedCrash.userId || 'Unknown',
                    userCountry: selectedCrash.userCountry || 'Unknown',
                    userProvince: selectedCrash.userProvince || 'Unknown',
                    connectionType: selectedCrash.connectionType || 'Unknown'
                };
            };

            const getSelectedDeviceData = () => {
                if (!selectedCrash) return null;
                
                if (selectedUserIndex >= 0 && selectedUserIndex < selectedCrash.affectedUsers.length) {
                    const user = selectedCrash.affectedUsers[selectedUserIndex];
                    return {
                        device: user.device || selectedCrash.devices[selectedDeviceIndex] || 'Unknown Device',
                        appVersion: user.appVersion || selectedCrash.appVersion || 'Unknown',
                        androidVersion: user.androidVersion || selectedCrash.androidVersion || 'Unknown',
                        screenDimensions: user.screenDimensions || selectedCrash.screenDimensions || 'Unknown',
                        screenInch: user.screenInch || selectedCrash.screenInch || 'Unknown',
                        screenDp: user.screenDp || selectedCrash.screenDp || 'Unknown',
                        screenDpi: user.screenDpi || selectedCrash.screenDpi || 'Unknown',
                        crashTime: user.crashTime || user.time || selectedCrash.crashTime || '00:00:00'
                    };
                }
                
                if (selectedDeviceIndex >= 0 && selectedDeviceIndex < selectedCrash.devices.length) {
                    const device = selectedCrash.devices[selectedDeviceIndex];
                    return {
                        device: device,
                        appVersion: selectedCrash.appVersion || 'Unknown',
                        androidVersion: selectedCrash.androidVersion || 'Unknown',
                        screenDimensions: selectedCrash.screenDimensions || 'Unknown',
                        screenInch: selectedCrash.screenInch || 'Unknown',
                        screenDp: selectedCrash.screenDp || 'Unknown',
                        screenDpi: selectedCrash.screenDpi || 'Unknown',
                        crashTime: selectedCrash.crashTime || '00:00:00'
                    };
                }
                
                return {
                    device: selectedCrash.devices[0] || 'Unknown Device',
                    appVersion: selectedCrash.appVersion || 'Unknown',
                    androidVersion: selectedCrash.androidVersion || 'Unknown',
                    screenDimensions: selectedCrash.screenDimensions || 'Unknown',
                    screenInch: selectedCrash.screenInch || 'Unknown',
                    screenDp: selectedCrash.screenDp || 'Unknown',
                    screenDpi: selectedCrash.screenDpi || 'Unknown',
                    crashTime: selectedCrash.crashTime || '00:00:00'
                };
            };

            const selectedUserData = selectedCrash ? getSelectedUserData() : null;
            const selectedDeviceData = selectedCrash ? getSelectedDeviceData() : null;

            if (selectedCrash) {
                const colors = getStatusColor(selectedCrash.status);
                const currentCrashKey = (selectedCrash.docId || selectedCrash.id).toString();
                return (
                    <div className="space-y-6">
                        <div className="flex justify-between items-center">
                            <button onClick={() => setSelectedCrash(null)} 
                                className="flex items-center gap-2 text-purple-600 hover:text-purple-700 font-semibold mb-4">
                                <i className="fas fa-arrow-right"></i> العودة
                            </button>
                            <button onClick={() => deleteCrashes([currentCrashKey])}
                                className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md transition mb-4">
                                <i className="fas fa-trash-alt"></i>
                                <span>حذف هذا العطل</span>
                            </button>
                        </div>

                        {/* رأس التفاصيل */}
                        <div className={`${colors.bg} border-2 ${colors.border} rounded-2xl p-6`} style={{backgroundColor: 'var(--bg-card)', borderColor: colors.border}}>
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div className="flex-1">
                                    <div className="flex items-center gap-3 mb-3 flex-wrap">
                                        <h1 className="text-3xl font-black" style={{color: 'var(--text-primary)'}}>Crash #{selectedCrash.id}</h1>
                                        <div className="flex items-center gap-2">
                                            <span className={`bg-gradient-to-r ${colors.badge} text-white px-4 py-2 rounded-full font-bold text-sm`}>
                                                {getStatusLabel(selectedCrash.status)}
                                            </span>
                                            <select value={selectedCrash.status || 'open'} 
                                                onChange={e => updateCrashStatus(currentCrashKey, e.target.value)}
                                                className="px-3 py-2 border-2 rounded-full text-sm font-bold focus:outline-none cursor-pointer" 
                                                style={{backgroundColor: 'var(--input-bg)', color: 'var(--input-text)', borderColor: 'var(--input-border)'}}>
                                                <option value="open">🔴 مفتوح</option>
                                                <option value="investigating">🔍 قيد التحقيق</option>
                                                <option value="fixed">✅ مصلح</option>
                                                <option value="closed">⚪ مغلق</option>
                                            </select>
                                        </div>
                                    </div>
                                    <p className={`${colors.text} font-semibold`}>{selectedCrash.errorType}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-sm mb-1" style={{color: 'var(--text-muted)'}}>آخر ظهور:</p>
                                    <p className="text-2xl font-black whitespace-nowrap" style={{color: 'var(--text-primary)'}}>{selectedCrash.lastSeen}</p>
                                </div>
                            </div>
                        </div>

                        {/* البيانات الأساسية */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="rounded-2xl shadow-lg p-6 border-2" style={{backgroundColor: 'var(--bg-card)', borderColor: '#dbeafe'}}>
                                <h3 className="font-bold text-sm mb-3" style={{color: 'var(--text-secondary)'}}>📊 بيانات الخطأ</h3>
                                <div className="space-y-2 text-sm">
                                    <div><span style={{color: 'var(--text-muted)'}}>نوع الخطأ:</span> <span className="font-bold" style={{color: 'var(--text-primary)'}}>{selectedCrash.errorType}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>الملف:</span> <span className="font-mono text-xs" style={{color: '#a78bfa'}}>{selectedCrash.file}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>رقم السطر:</span> <span className="font-bold" style={{color: '#ea580c'}}>{selectedCrash.line}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>الشاشة:</span> <span className="font-bold" style={{color: 'var(--text-primary)'}}>{selectedCrash.screen}</span></div>
                                </div>
                            </div>

                            <div className="rounded-2xl shadow-lg p-6 border-2" style={{backgroundColor: 'var(--bg-card)', borderColor: '#dcfce7'}}>
                                <h3 className="font-bold text-sm mb-3" style={{color: 'var(--text-secondary)'}}>👤 بيانات المستخدم</h3>
                                <div className="space-y-2 text-sm">
                                    <div><span style={{color: 'var(--text-muted)'}}>الاسم:</span> <span className="font-bold text-base" style={{color: '#059669'}}>{selectedUserData?.name}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>معرف المستخدم:</span> <span className="font-mono text-xs" style={{color: '#0369a1'}}>{selectedUserData?.userId}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>الدولة:</span> <span className="font-bold" style={{color: 'var(--text-primary)'}}>{selectedUserData?.userCountry}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>المحافظة:</span> <span className="font-bold" style={{color: 'var(--text-primary)'}}>{selectedUserData?.userProvince}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>نوع الاتصال:</span> <span className="font-bold" style={{color: '#4f46e5'}}>{selectedUserData?.connectionType}</span></div>
                                </div>
                            </div>

                            <div className="rounded-2xl shadow-lg p-6 border-2" style={{backgroundColor: 'var(--bg-card)', borderColor: '#f3e8ff'}}>
                                <h3 className="font-bold text-sm mb-3" style={{color: 'var(--text-secondary)'}}>📱 بيانات الجهاز</h3>
                                <div className="space-y-2 text-sm">
                                    <div><span style={{color: 'var(--text-muted)'}}>الجهاز:</span> <span className="font-bold" style={{color: '#667eea'}}>{selectedDeviceData?.device}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>إصدار التطبيق:</span> <span className="font-bold" style={{color: '#15803d'}}>v{selectedDeviceData?.appVersion}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>نسخة Android:</span> <span className="font-bold" style={{color: 'var(--text-primary)'}}>{selectedDeviceData?.androidVersion}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>أبعاد الشاشة (بكسل):</span> <span className="font-mono text-xs" style={{color: 'var(--text-primary)'}}>{selectedDeviceData?.screenDimensions}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>حجم الشاشة (بالإنش):</span> <span className="font-mono text-xs" style={{color: '#0369a1'}}>{selectedDeviceData?.screenInch}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>أبعاد الشاشة (DP):</span> <span className="font-mono text-xs" style={{color: '#059669'}}>{selectedDeviceData?.screenDp}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>الكثافة (DPI):</span> <span className="font-mono text-xs" style={{color: '#7c3aed'}}>{selectedDeviceData?.screenDpi}</span></div>
                                    <div><span style={{color: 'var(--text-muted)'}}>وقت الخطأ:</span> <span className="font-bold" style={{color: '#dc2626'}}>{selectedDeviceData?.crashTime}</span></div>
                                </div>
                            </div>
                        </div>

                        {/* تفاصيل إضافية */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="rounded-2xl shadow-lg p-6" style={{backgroundColor: 'var(--bg-card)'}}>
                                <h3 className="font-bold mb-4" style={{color: 'var(--text-primary)'}}>📱 نماذج الأجهزة المتأثرة</h3>
                                <div className="space-y-2">
                                    {selectedCrash.devices.map((device, i) => (
                                        <div key={i} onClick={() => {
                                            setSelectedDeviceIndex(i);
                                            const userIndex = selectedCrash.affectedUsers.findIndex(u => u.device === device);
                                            if (userIndex >= 0) {
                                                setSelectedUserIndex(userIndex);
                                            } else {
                                                setSelectedUserIndex(-1);
                                            }
                                        }}
                                            className={`rounded-lg p-3 flex items-center gap-2 cursor-pointer transition ${selectedDeviceIndex === i ? 'ring-2' : 'hover:opacity-80'}`}
                                            style={{backgroundColor: selectedDeviceIndex === i ? 'rgba(102, 126, 234, 0.2)' : 'var(--bg-gray-100)', 
                                                    borderRadius: '0.5rem',
                                                    ringColor: '#667eea'}}>
                                            <i className={`fas fa-mobile ${selectedDeviceIndex === i ? 'text-blue-600' : 'text-blue-500'}`}></i>
                                            <span className="font-semibold flex-1" style={{color: 'var(--text-primary)'}}>{device}</span>
                                            {selectedDeviceIndex === i && <i className="fas fa-check text-green-500"></i>}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="rounded-2xl shadow-lg p-6" style={{backgroundColor: 'var(--bg-card)'}}>
                                <h3 className="font-bold mb-4" style={{color: 'var(--text-primary)'}}>📅 التواريخ المهمة</h3>
                                <div className="space-y-3">
                                    <div className="rounded-lg p-4" style={{backgroundColor: 'rgba(96, 165, 250, 0.1)'}}>
                                        <p className="text-xs mb-1" style={{color: 'var(--text-muted)'}}>🔸 أول ظهور</p>
                                        <p className="font-black text-lg whitespace-nowrap" style={{color: '#0369a1'}}>{selectedCrash.firstSeen}</p>
                                    </div>
                                    <div className="rounded-lg p-4" style={{backgroundColor: 'rgba(239, 68, 68, 0.1)'}}>
                                        <p className="text-xs mb-1" style={{color: 'var(--text-muted)'}}>🔴 آخر ظهور</p>
                                        <p className="font-black text-lg whitespace-nowrap" style={{color: '#dc2626'}}>{selectedCrash.lastSeen}</p>
                                    </div>
                                    <div className="rounded-lg p-4" style={{backgroundColor: 'var(--bg-gray-100)'}}>
                                        <p className="text-xs mb-1" style={{color: 'var(--text-muted)'}}>📊 عدد الأيام</p>
                                        <p className="font-black text-lg whitespace-nowrap" style={{color: 'var(--text-primary)'}}>{Math.ceil((new Date(selectedCrash.lastSeen) - new Date(selectedCrash.firstSeen)) / (1000 * 60 * 60 * 24))} أيام</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* معلومات إضافية */}
                        {selectedCrash.lessonName && (
                            <div className="rounded-2xl p-6 border-2" style={{backgroundColor: 'rgba(79, 70, 229, 0.1)', borderColor: '#818cf8'}}>
                                <h3 className="font-bold mb-2" style={{color: 'var(--text-primary)'}}>📖 الدرس المرتبط</h3>
                                <p className="font-bold" style={{color: '#4f46e5'}}>{selectedCrash.lessonName}</p>
                            </div>
                        )}

                        {/* آخر المستخدمين المتأثرين */}
                        <div className="rounded-2xl shadow-lg p-6" style={{backgroundColor: 'var(--bg-card)'}}>
                            <h3 className="font-bold mb-4" style={{color: 'var(--text-primary)'}}>👥 آخر {Math.min(5, selectedCrash.affectedUsers.length)} مستخدمين متأثرين</h3>
                            <div className="space-y-3">
                                {selectedCrash.affectedUsers.slice(0, 5).map((user, i) => (
                                    <div key={i} onClick={() => setSelectedUserIndex(i)}
                                        className={`rounded-xl p-4 flex items-center justify-between border transition cursor-pointer ${selectedUserIndex === i ? 'ring-2' : 'hover:opacity-80'}`}
                                        style={{backgroundColor: selectedUserIndex === i ? 'rgba(102, 126, 234, 0.1)' : 'var(--bg-gray-100)', 
                                                borderColor: selectedUserIndex === i ? '#667eea' : 'var(--border-light)',
                                                ringColor: '#667eea'}}>
                                        <div>
                                            <p className="font-bold" style={{color: 'var(--text-primary)'}}>{user.name}</p>
                                            <p className="text-xs" style={{color: 'var(--text-muted)'}}>{user.id}</p>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className="text-right">
                                                <p className="text-sm font-semibold" style={{color: 'var(--text-secondary)'}}>{user.device}</p>
                                                <p className="text-xs" style={{color: 'var(--text-muted)'}}>{user.time}</p>
                                            </div>
                                            {selectedUserIndex === i && <i className="fas fa-check text-green-500 text-lg"></i>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // الصفحة الرئيسية للأعطال
            return (
                <div className="space-y-6">
                    {/* البطاقات الإحصائية */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-gradient-to-br from-red-500 to-red-600 rounded-2xl shadow-lg p-6 text-white">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-red-100 text-sm font-semibold">إجمالي الأعطال</p>
                                    <p className="text-4xl font-black mt-1">{totalCrashes}</p>
                                </div>
                                <i className="fas fa-bug text-5xl text-red-400 opacity-50"></i>
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-orange-500 to-orange-600 rounded-2xl shadow-lg p-6 text-white">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-orange-100 text-sm font-semibold">الأعطال اليوم</p>
                                    <p className="text-4xl font-black mt-1">{todayCrashes}</p>
                                </div>
                                <i className="fas fa-calendar-day text-5xl text-orange-400 opacity-50"></i>
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-purple-500 to-purple-600 rounded-2xl shadow-lg p-6 text-white">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-purple-100 text-sm font-semibold">المستخدمين المتأثرين</p>
                                    <p className="text-4xl font-black mt-1">{crashes.reduce((sum, c) => sum + c.usersAffected, 0)}</p>
                                </div>
                                <i className="fas fa-users text-5xl text-purple-400 opacity-50"></i>
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-2xl shadow-lg p-6 text-white">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-indigo-100 text-sm font-semibold">أكثر صفحة مشاكل</p>
                                    <p className="text-lg font-bold mt-1 truncate">{topPage.screen || '—'}</p>
                                </div>
                                <i className="fas fa-crown text-5xl text-indigo-400 opacity-50"></i>
                            </div>
                        </div>
                    </div>

                    {/* أدوات البحث والفلترة */}
                    <div className="rounded-2xl shadow-lg p-6" style={{backgroundColor: 'var(--bg-card)', color: 'var(--text-primary)'}}>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                            <div className="md:col-span-2 lg:col-span-1">
                                <label className="block text-sm font-bold mb-2" style={{color: 'var(--text-secondary)'}}>🔍 بحث</label>
                                <input type="text" placeholder="خطأ، شاشة، ملف..." 
                                    value={searchTerm} onChange={e => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                                    className="w-full px-4 py-3 border-2 rounded-lg focus:outline-none" style={{backgroundColor: 'var(--input-bg)', color: 'var(--input-text)', borderColor: 'var(--input-border)'}} />
                            </div>

                            <div>
                                <label className="block text-sm font-bold mb-2" style={{color: 'var(--text-secondary)'}}>📊 الحالة</label>
                                <select value={filterStatus} onChange={e => { setFilterStatus(e.target.value); setCurrentPage(1); }}
                                    className="w-full px-4 py-3 border-2 rounded-lg focus:outline-none" style={{backgroundColor: 'var(--input-bg)', color: 'var(--input-text)', borderColor: 'var(--input-border)'}}>
                                    <option value="all">جميع الحالات</option>
                                    <option value="open">مفتوح</option>
                                    <option value="investigating">قيد التحقيق</option>
                                    <option value="fixed">مصلح</option>
                                    <option value="closed">مغلق</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-bold mb-2" style={{color: 'var(--text-secondary)'}}>⚙️ نوع الخطأ</label>
                                <select value={filterErrorType} onChange={e => { setFilterErrorType(e.target.value); setCurrentPage(1); }}
                                    className="w-full px-4 py-3 border-2 rounded-lg focus:outline-none" style={{backgroundColor: 'var(--input-bg)', color: 'var(--input-text)', borderColor: 'var(--input-border)'}}>
                                    <option value="all">جميع الأخطاء</option>
                                    {[...new Set(crashes.map(c => c.errorType))].map(type => (
                                        <option key={type} value={type}>{type}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-bold mb-2" style={{color: 'var(--text-secondary)'}}>📱 الجهاز</label>

                                    className="w-full px-4 py-3 border-2 rounded-lg focus:outline-none" style={{backgroundColor: 'var(--input-bg)', color: 'var(--input-text)', borderColor: 'var(--input-border)'}}>
                                    <option value="all">جميع الأجهزة</option>
                                    {[...new Set(crashes.flatMap(c => c.devices))].map(device => (
                                        <option key={device} value={device}>{device}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-bold mb-2" style={{color: 'var(--text-secondary)'}}>⬆️ ترتيب</label>

                                    className="w-full px-4 py-3 border-2 rounded-lg focus:outline-none" style={{backgroundColor: 'var(--input-bg)', color: 'var(--input-text)', borderColor: 'var(--input-border)'}}>

                                    <option value="affected">الأكثر تأثراً</option>
                                    <option value="firstSeen">أول ظهور</option>
                                </select>
                            </div>
                        </div>
                    </div>

                                <i className="fas fa-check-square text-red-600 text-xl"></i>
                                <span className="font-bold text-red-800 text-sm">

                                </span>

                                    className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shadow-md transition">

                                    <span>حذف الأعطال المحددة</span>
                                </button>

                                    className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl text-xs font-bold transition">

                                </button>
                            </div>
                        </div>

                    <div className="rounded-2xl shadow-lg overflow-hidden" style={{backgroundColor: 'var(--bg-card)'}}>
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead style={{backgroundColor: 'var(--bg-gray-100)', color: 'var(--text-secondary)'}} className="border-b-2" style={{borderColor: 'var(--border-light)'}}>
                                    <tr>
                                        <th className="px-4 py-4 text-center text-sm font-bold whitespace-nowrap w-12">
                                            <input type="checkbox"
                                                checked={paginatedData.length > 0 && paginatedData.every(c => selectedCrashIds.includes((c.docId || c.id).toString()))}
                                                onChange={toggleSelectAll}
                                                className="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 cursor-pointer"
                                                title="تحديد الكل"
                                            />
                                        </th>
                                        <th className="px-6 py-4 text-right text-sm font-bold whitespace-nowrap">Crash ID</th>
                                        <th className="px-6 py-4 text-right text-sm font-bold whitespace-nowrap">نوع الخطأ</th>
                                        <th className="px-6 py-4 text-right text-sm font-bold whitespace-nowrap">الشاشة</th>
                                        <th className="px-6 py-4 text-right text-sm font-bold whitespace-nowrap">الملف</th>
                                        <th className="px-6 py-4 text-right text-sm font-bold whitespace-nowrap">المتأثرين</th>

                const deserialize = (obj) => {
                    if (!obj || typeof obj !== 'object') return obj;
                    if (Array.isArray(obj)) return obj.map(deserialize);
                    if (obj._type === 'timestamp') return obj.millis;
                    const r = {};
                    Object.keys(obj).forEach(k => { r[k] = deserialize(obj[k]); });
                    return r;
                };

                const apply = (users, reports, pageViews) => {
                    if (!active) return;
                    try {
                        setDbData(processFirebaseData(users, reports, pageViews));
                        setLoading(false);
                    } catch (e) { console.error(e); setLoading(false); }
                };

                // 1. postMessage من الصفحة الأم
                const onMsg = (e) => {
                    if (!active || e.data?.type !== 'FIREBASE_DATA') return;
                    gotMsg = true;
                    apply(
                        (e.data.users || []).map(deserialize),
                        (e.data.reports || []).map(deserialize),
                        (e.data.pageViews || []).map(deserialize)
                    );
                };
                window.addEventListener('message', onMsg);

                // طلب البيانات
                try { if (window.parent !== window) window.parent.postMessage({ type: 'REQUEST_FIREBASE_DATA' }, '*'); } catch (e) { }

                // 2. Fallback: Firebase Compat SDK بعد 2.5 ث
                const timer = setTimeout(() => {
                    if (gotMsg || !active) return;
                    console.log('🔌 Fallback Firebase Compat...');
                    if (!db) {
                        console.error("Firebase db is not initialized yet. Fallback cancelled.");
                        return;
                    }
                    let users = [], reports = [], ul = false, rl = false;
                    const check = () => { if (ul && rl) apply(users, reports); };
                    unsubU = db.collection('users').onSnapshot(s => { users = []; s.forEach(d => users.push({ id: d.id, ...d.data() })); ul = true; check(); }, e => { ul = true; check(); });
                    unsubR = db.collection('reports').onSnapshot(s => { reports = []; s.forEach(d => reports.push({ id: d.id, ...d.data() })); rl = true; check(); }, e => { rl = true; check(); });
                }, 2500);

                return () => { active = false; clearTimeout(timer); window.removeEventListener('message', onMsg); if (unsubU) unsubU(); if (unsubR) unsubR(); };

import com.google.firebase.firestore.FirebaseFirestore
import com.google.firebase.firestore.FieldValue
import java.text.SimpleDateFormat
import java.util.*

object SubscriptionManager {

    private val db = FirebaseFirestore.getInstance()
    private val auth = FirebaseAuth.getInstance()
    private val monthFormat = SimpleDateFormat("yyyy-MM", Locale.US)

    // ====================================================
    // 1. احفظ بيانات الاشتراك عند نجاح الدفع
    // ====================================================
    fun saveSubscription(
        plan: String,          // "monthly" | "quarterly" | "semiAnnual" | "annual"
        startDate: Date,       // تاريخ بدء الاشتراك
        endDate: Date,         // تاريخ الانتهاء
        transactionId: String  // معرف المعاملة من مزود الدفع
    ) {
        val uid = auth.currentUser?.uid ?: return
        val email = auth.currentUser?.email ?: ""

        // 1.a حدّث مستند المستخدم في مجموعة users
        val userUpdates = mapOf(
            "subscriptionPlan"   to plan,
            "subscriptionStart"  to com.google.firebase.Timestamp(startDate),
            "subscriptionEnd"    to com.google.firebase.Timestamp(endDate),
            "isSubscriber"       to true,
            "subscriptionStatus" to "active"
        )
        db.collection("users").document(uid).update(userUpdates)

        // 1.b سجّل حدث completedPayment
        logPaymentEvent(
            eventType     = "completedPayment",
            plan          = plan,
            amount        = getPlanPrice(plan),
            transactionId = transactionId
        )
    }

    // ====================================================
    // 2. سجّل حدث دفع (استدعه في كل خطوة)
    // ====================================================
    fun logPaymentEvent(
        eventType: String,
        plan: String? = null,
        failureReason: String? = null,
        amount: Double? = null,
        transactionId: String? = null
    ) {
        val uid   = auth.currentUser?.uid   ?: "anonymous"
        val email = auth.currentUser?.email ?: "anonymous"

        val event = hashMapOf<String, Any>(
            "userId"    to uid,
            "userEmail" to email,
            "eventType" to eventType,
            "timestamp" to FieldValue.serverTimestamp(),
            "month"     to monthFormat.format(Date())
        )
        plan?.let          { event["plan"]          = it }
        failureReason?.let { event["failureReason"] = it }
        amount?.let        { event["amount"]        = it }
        transactionId?.let { event["transactionId"] = it }

        db.collection("paymentEvents").add(event)
    }

    // ====================================================
    // 3. ألغِ الاشتراك (عند انتهائه أو الإلغاء)
    // ====================================================
    fun cancelSubscription() {
        val uid = auth.currentUser?.uid ?: return
        val updates = mapOf(
            "isSubscriber"       to false,
            "subscriptionStatus" to "cancelled"
        )
        db.collection("users").document(uid).update(updates)
    }

    // ====================================================
    // 4. أسعار الخطط (عدّلها حسب أسعارك)
    // ====================================================
    private fun getPlanPrice(plan: String): Double = when (plan) {
        "monthly"    -> 29.99
        "quarterly"  -> 69.99
        "semiAnnual" -> 119.99
        "annual"     -> 199.99
        else         -> 0.0
    }
}`}</pre>

    private val cardWatcher = object : TextWatcher {
        private var hasLogged = false
        override fun afterTextChanged(s: Editable?) {
            if (!hasLogged && s?.isNotEmpty() == true) {
                hasLogged = true
                // ★ الحدث 3: إدخال بيانات البطاقة

            "quarterly"  -> calendar.add(Calendar.MONTH, 3)
            "semiAnnual" -> calendar.add(Calendar.MONTH, 6)
            "annual"     -> calendar.add(Calendar.YEAR,  1)
        }
        val endDate = calendar.time

        // ★ الحدث 4: إتمام الدفع + حفظ الاشتراك
        SubscriptionManager.saveSubscription(
            plan          = selectedPlan,
            startDate     = startDate,
            endDate       = endDate,
            transactionId = transactionId
        )

    private fun onPaymentFailed(error: Exception) {
        // ★ الحدث 5: فشل الدفع
        SubscriptionManager.logPaymentEvent(
            eventType     = "failedPayment",
            plan          = selectedPlan,
            failureReason = error.message ?: "unknown_error"
        )
    }

object AdRevenueTracker {
    private val db = FirebaseFirestore.getInstance()
    private val dateFormat  = SimpleDateFormat("yyyy-MM-dd", Locale.US)
    private val monthFormat = SimpleDateFormat("yyyy-MM",    Locale.US)

    fun logImpression(estimatedRevenue: Double = 0.002) {
        // estimatedRevenue = eCPM المتوسط ÷ 1000
        // اضبطه حسب eCPM الفعلي من لوحة AdMob
        val today = dateFormat.format(Date())
        val month = monthFormat.format(Date())

        val docRef = db.collection("adRevenue").document(today)
        db.runTransaction { tx ->
            val snap = tx.get(docRef)
            val current = snap.getDouble("revenue") ?: 0.0
            val impressions = snap.getLong("impressions") ?: 0L
            tx.set(docRef, mapOf(
                "date"        to today,
                "month"       to month,
                "revenue"     to current + estimatedRevenue,
                "impressions" to impressions + 1,
                "source"      to "admob"
            ))
        }
    }
}

// الاستخدام في BannerAd:
banner.adListener = object : AdListener() {
    override fun onAdImpression() {
        AdRevenueTracker.logImpression()
    }
}

// الاستخدام في RewardedAd:
rewardedAd?.show(this) { rewardItem ->
    AdRevenueTracker.logImpression(estimatedRevenue = 0.02) // Rewarded أعلى eCPM
}`}</pre>

    }

                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mx-auto"></div>
                            <p className="mt-4 text-gray-600">جاري التحميل...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <LoginComponent />;
            }

            return <Dashboard />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper />);
    </script>
</body>

</html>
