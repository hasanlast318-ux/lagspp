<body dir="rtl">
    <div id="root"></div>

    <script>
        // ===== استقبال الثيم من الصفحة الأم =====
        (function () {
            function applyTheme(theme) {
                if (theme === 'dark') {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
                // إطلاق حدث مخصص لإعادة رسم الـ charts
                window.dispatchEvent(new CustomEvent('dashboardThemeChanged', { detail: { theme } }));
            }

            // الاستماع لرسائل الثيم من الصفحة الأم
            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'SET_THEME') {
                    applyTheme(e.data.theme);
                }
            });

            // تطبيق الثيم المحفوظ فوراً
            const savedTheme = localStorage.getItem('theme') || 'light';
            applyTheme(savedTheme);

            // طلب الثيم من الصفحة الأم عند التحميل
            window.addEventListener('load', function () {
                try { window.parent.postMessage({ type: 'REQUEST_THEME' }, '*'); } catch (e) { }
            });
        })();
    </script>

    <script type="text/babel" data-type="module">
        // ======================= Firebase Config =======================
        // استيراد الإعدادات من الملف
        import { firebaseConfig } from '../firebase-config.js';

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ===================== أسعار الخطط (عدّلها حسب أسعارك الفعلية) =====================
        const PLAN_PRICES = {
            monthly: 29.99,
            quarterly: 69.99,
            semiAnnual: 119.99,
            annual: 199.99
        };

        // ===================== دوال مساعدة =====================
        const formatNumber = (num) => {
            if (!num && num !== 0) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return Math.round(num).toString();
        };

        const formatCurrency = (num) => {
            return '$' + (num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const toMs = (ts) => {
            if (!ts) return 0;
            if (typeof ts === 'object' && typeof ts.toMillis === 'function') return ts.toMillis();
            if (typeof ts === 'object' && ts.seconds !== undefined) return ts.seconds * 1000;
            if (typeof ts === 'number') return ts > 9999999999 ? ts : ts * 1000;
            if (typeof ts === 'string') return isNaN(Number(ts)) ? Date.parse(ts) || 0 : Number(ts);
            return 0;
        };

        // ===================== دوال حضور واتصال المستخدمين =====================
        const ONLINE_HEARTBEAT_TIMEOUT = 15000;
        const REPORT_PAGE_HEARTBEAT_TIMEOUT = 9000;

        const formatTime = (ts) => {
            if (!ts) return '';
            const date = new Date(toMs(ts));
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        };

        const formatInactiveSince = (timestamp) => {
            if (!timestamp) return 'غير متوفر';
            const diff = Math.max(0, Date.now() - toMs(timestamp));
            const days = Math.floor(diff / 86400000);
            if (days <= 0) return 'اليوم';
            if (days === 1) return 'منذ يوم';
            if (days === 2) return 'منذ يومين';
            if (days < 7) return `منذ ${days} أيام`;
            const weeks = Math.floor(days / 7);
            if (days < 30) return weeks === 1 ? 'منذ أسبوع' : `منذ ${weeks} أسابيع`;
            const months = Math.floor(days / 30);
            return months === 1 ? 'منذ شهر' : `منذ ${months} أشهر`;
        };

        const getFreshTimestamp = (user = {}, keys = []) => {
            return Math.max(...keys.map(key => toMs(user[key])), 0);
        };

        const firstTextValue = (...values) => {
            for (const value of values) {
                if (typeof value === 'string' && value.trim()) return value.trim();
            }
            return '';
        };

        const getUserLocationText = (user = {}) => {
            const presence = user.presence || user.userPresence || user.statusInfo || {};
            const level = user.level || user.currentLevel || user.levelNumber || presence.level || presence.currentLevel || '';
            const lesson = user.lessonNumber || user.currentLessonNumber || user.lessonNo || user.lesson || presence.lessonNumber || presence.currentLessonNumber || '';
            const page = firstTextValue(user.currentPage, user.activePage, user.screen, user.route, user.currentRoute);
            const location = firstTextValue(
                user.userLocation,
                user.user_location,
                user.locationName,
                user.location_name,
                user.pageTitle,
                user.page_title,
                user.currentPageName,
                user.current_page_name,
                user.activePageName,
                user.screenName,
                user.screen_name,
                user.routeName,
                user.route_name,
                presence.userLocation,
                presence.user_location,
                presence.locationName,
                presence.pageTitle,
                presence.currentPageName
            );
            const detail = firstTextValue(
                user.userSubLocation,
                user.user_sub_location,
                user.subLocation,
                user.sub_location,
                user.innerLocation,
                user.inner_location,
                user.sectionName,
                user.section_name,
                user.tabName,
                user.tab_name,
                user.subPageName,
                user.sub_page_name,
                user.currentSectionName,
                user.current_section_name,
                user.currentTabName,
                user.current_tab_name,
                presence.userSubLocation,
                presence.subLocation,
                presence.innerLocation,
                presence.sectionName,
                presence.tabName,
                presence.subPageName,
                presence.currentSectionName,
                presence.currentTabName
            );

            if (level && lesson) return `المستوى ${level} - الدرس ${lesson}`;
            if (location && detail && location !== detail) return `${location} - ${detail}`;
            if (location) return location;
            if (detail) return detail;
            if (page && !['app', 'report', 'offline'].includes(page.toLowerCase())) return page;
            return '';
        };

        const getPresenceState = (user = {}) => {
            const now = Date.now();
            const lastActiveAt = getFreshTimestamp(user, [
                'presenceUpdatedAt',
                'lastSeen',
                'lastSeenAt',
                'userLastSeen',
                'userLastActiveAt',
                'lastActive',
                'lastActiveAt',
                'updatedAt'
            ]);
            const reportPageAt = getFreshTimestamp(user, [
                'reportPageSeenAt',
                'reportPageActiveAt',
                'userInChatAt',
                'inChatAt',
                'chatActiveAt'
            ]);
            const isFreshOnline = lastActiveAt && now - lastActiveAt <= ONLINE_HEARTBEAT_TIMEOUT;
            const isFreshInChat = reportPageAt && now - reportPageAt <= REPORT_PAGE_HEARTBEAT_TIMEOUT;
            const page = String(user.currentPage || user.activePage || user.screen || '').toLowerCase();
            const explicitOffline = user.userOnline === false || user.online === false || user.isOnline === false || user.user_online === false || user.is_online === false || user.isActive === false;
            const explicitOutOfChat = user.userInChat === false || user.inChat === false || user.user_in_chat === false || user.in_chat === false;
            const explicitInChat = user.userInChat === true || user.inChat === true || user.user_in_chat === true || user.in_chat === true || page.includes('report') || page.includes('بلاغ') || page.includes('problem');
            const explicitOnline = user.userOnline === true || user.online === true || user.active === true || user.isOnline === true || user.user_online === true || user.is_online === true || user.isActive === true;
            const isStaleExplicitOnline = explicitOnline && lastActiveAt && now - lastActiveAt > ONLINE_HEARTBEAT_TIMEOUT;
            const locationText = getUserLocationText(user);

            if (explicitOffline) {
                return {
                    className: 'offline',
                    text: lastActiveAt ? `غير متصل - آخر ظهور ${formatTime(lastActiveAt)}` : 'غير متصل',
                    color: 'from-gray-400 to-gray-500',
                    dotColor: 'bg-gray-400',
                    status: 'offline',
                    lastSeenText: lastActiveAt ? formatInactiveSince(lastActiveAt) : 'غير متوفر'
                };
            }

            if ((isFreshInChat && !explicitOutOfChat) || (explicitInChat && isFreshOnline && !explicitOutOfChat)) {
                return {
                    className: 'in-chat',
                    text: 'متصل الآن في صفحة البلاغ',
                    color: 'from-emerald-400 to-emerald-600',
                    dotColor: 'bg-emerald-500',
                    status: 'in-chat',
                    lastSeenText: 'الآن'
                };
            }

            if (isFreshOnline || (explicitOnline && !isStaleExplicitOnline)) {
                return {
                    className: 'active-app',
                    text: locationText ? `متاح في التطبيق - ${locationText}` : 'متاح في التطبيق',
                    color: 'from-blue-400 to-blue-600',
                    dotColor: 'bg-blue-500',
                    status: 'online',
                    lastSeenText: 'الآن'
                };
            }

            return {
                className: 'offline',
                text: lastActiveAt ? `غير متصل - آخر ظهور ${formatTime(lastActiveAt)}` : 'غير متصل',
                color: 'from-gray-400 to-gray-500',
                dotColor: 'bg-gray-400',
                status: 'offline',
                lastSeenText: lastActiveAt ? formatInactiveSince(lastActiveAt) : 'غير متوفر'
            };
        };

        const getMonthKey = (ts) => {
            const ms = toMs(ts);
            if (!ms) return null;
            const d = new Date(ms);
            if (isNaN(d.getTime())) return null;
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        };

        const monthNamesAr = {
            '01': 'يناير', '02': 'فبراير', '03': 'مارس', '04': 'أبريل', '05': 'مايو', '06': 'يونيو',
            '07': 'يوليو', '08': 'أغسطس', '09': 'سبتمبر', '10': 'أكتوبر', '11': 'نوفمبر', '12': 'ديسمبر'
        };
        const getMonthName = (key) => {
            if (!key) return '';
            const [y, m] = key.split('-');
            return `${monthNamesAr[m] || m} ${y}`;
        };

        // ===================== كشف نوع الخطة من حقول Firebase =====================
        // يحاول قراءة الخطة من أي حقل محتمل يضعه التطبيق
        const getPlanType = (u) => {
            const raw = String(
                u.subscriptionPlan || u.plan || u.subscription ||
                u.planType || u.subPlan || u.membershipType || ''
            ).toLowerCase().trim();

            if (!raw || raw === 'free' || raw === 'none' || raw === 'false') return null;
            if (raw === 'true' || raw === 'subscriber' || raw === 'premium') return 'monthly'; // افتراضي

            if (raw.includes('شهر') || raw.includes('month') || raw === 'monthly') return 'monthly';
            if (raw.includes('ربع') || raw.includes('quarter') || raw === 'quarterly') return 'quarterly';
            if (raw.includes('نصف') || raw.includes('half') || raw.includes('semi') || raw === 'semiannual') return 'semiAnnual';
            if (raw.includes('سنو') || raw.includes('year') || raw.includes('annu') || raw === 'annual') return 'annual';

            return null; // لا توجد خطة محددة
        };

        // ===================== هل تطبيقك يحتوي على بيانات الاشتراك؟ =====================
        const checkHasSubscriptionData = (users) => {
            return users.some(u =>
                u.subscriptionPlan || u.plan || u.subscription ||
                u.planType || u.subPlan || u.membershipType ||
                u.subscriptionStart || u.subscriptionEnd || u.isSubscriber
            );
        };

        const checkHasBehaviorData = (users) => {
            return users.some(u => u.paymentEvents || u.subscriptionEvents);
        };

        // ===================== معالجة البيانات من Firebase =====================
        const processFirebaseData = (realUsers, realReports, realPageViews) => {
            const hasSubData = checkHasSubscriptionData(realUsers);
            const hasBehaviorData = checkHasBehaviorData(realUsers);

            // بناء Map للمستخدمين مع منع التكرار (الدمج عبر UID أو البريد الإلكتروني)
            const userMap = new Map();
            const emailToUid = new Map();
            const uidToKey = new Map();

            realUsers.forEach(u => {
                const uid = u.authUid || u.uid || u.id || '';
                const email = (u.email || u.userEmail || '').toLowerCase().trim();
                const key = uid || email;
                if (!key) return;

                const userObj = { ...u, _key: key, _source: 'users' };
                userMap.set(key, userObj);

                if (uid) uidToKey.set(uid, key);
                if (email) emailToUid.set(email, key);
            });

            realReports.forEach(r => {
                const uid = r.userId || r.uid || '';
                const email = (r.userEmail || r.email || '').toLowerCase().trim();

                // البحث عن مستخدم مطابق مسجل مسبقاً
                let key = null;
                if (uid && uidToKey.has(uid)) {
                    key = uidToKey.get(uid);
                } else if (email && emailToUid.has(email)) {
                    key = emailToUid.get(email);
                }

                if (key) {
                    const existing = userMap.get(key);
                    userMap.set(key, {
                        ...existing,
                        ...r,
                        email: existing.email || r.userEmail || r.email || '',
                        displayName: existing.displayName || r.userName || '',
                        createdAt: existing.createdAt || r.timestamp || 0,
                        _source: 'merged'
                    });
                } else {
                    const newKey = uid || email;
                    if (newKey) {
                        const newObj = {
                            ...r,
                            email: r.userEmail || r.email || '',
                            displayName: r.userName || '',
                            createdAt: r.timestamp || 0,
                            _key: newKey,
                            _source: 'reports'
                        };
                        userMap.set(newKey, newObj);
                        if (uid) uidToKey.set(uid, newKey);
                        if (email) emailToUid.set(email, newKey);
                    }
                }
            });

            const allUsers = Array.from(userMap.values());

            // توليد قائمة الأشهر
            const monthsSet = new Set();
            allUsers.forEach(u => { const m = getMonthKey(u.createdAt || u.timestamp); if (m) monthsSet.add(m); });
            realReports.forEach(r => { const m = getMonthKey(r.timestamp); if (m) monthsSet.add(m); });

            let sortedMonths = Array.from(monthsSet).filter(Boolean).sort();
            if (sortedMonths.length === 0) {
                const now = new Date();
                for (let i = 5; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    sortedMonths.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
            } else {
                const [y0, m0] = sortedMonths[0].split('-').map(Number);
                const [yN, mN] = sortedMonths[sortedMonths.length - 1].split('-').map(Number);
                let curr = new Date(y0, m0 - 1, 1);
                const maxD = new Date(yN, mN - 1, 1);
                const filled = [];
                while (curr <= maxD && filled.length < 100) {
                    filled.push(`${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}`);
                    curr.setMonth(curr.getMonth() + 1);
                }
                sortedMonths = filled;
            }
            while (sortedMonths.length < 4) {
                const [y, m] = (sortedMonths[0] || '2026-01').split('-').map(Number);
                const d = new Date(y, m - 2, 1);
                sortedMonths.unshift(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
            }

            // بناء البيانات الشهرية
            const dynamicStoredData = {};
            sortedMonths.forEach(mStr => {
                const usersUpTo = allUsers.filter(u => { const um = getMonthKey(u.createdAt || u.timestamp); return um && um <= mStr; });
                const newThisMonth = allUsers.filter(u => getMonthKey(u.createdAt || u.timestamp) === mStr);
                const reportsThisMonth = realReports.filter(r => getMonthKey(r.timestamp) === mStr);

                let subscribers = 0, monthly = 0, quarterly = 0, semiAnnual = 0, annual = 0;
                usersUpTo.forEach(u => {
                    const plan = getPlanType(u);
                    if (plan) {
                        subscribers++;
                        if (plan === 'monthly') monthly++;
                        else if (plan === 'quarterly') quarterly++;
                        else if (plan === 'semiAnnual') semiAnnual++;
                        else if (plan === 'annual') annual++;
                    }
                });

                const registered = usersUpTo.length - subscribers;
                // تقدير الضيوف كنسبة من المسجلين (أو صفر إذا لا يوجد)
                const guests = hasSubData ? Math.round(usersUpTo.length * 0.18) : 0;
                const total = usersUpTo.length + guests;

                // حساب الأرباح (فقط إذا كانت بيانات الاشتراك موجودة)
                const subRevenue = hasSubData ? (
                    monthly * PLAN_PRICES.monthly +
                    quarterly * (PLAN_PRICES.quarterly / 3) +
                    semiAnnual * (PLAN_PRICES.semiAnnual / 6) +
                    annual * (PLAN_PRICES.annual / 12)
                ) : 0;
                const adsRevenue = hasSubData ? Math.round(guests * 0.5 + registered * 0.15) : 0;
                const totalRevenue = Math.round(subRevenue + adsRevenue);

                // سلوك الدفع (من حقل paymentEvents إن وجد، وإلا محاكاة بسيطة)
                const completedPayment = subscribers;
                const clickedSubscribe = Math.round(subscribers * 1.4 + registered * 0.08);
                const openedPaymentNoCard = Math.round(subscribers * 1.2);
                const enteredCardNoComplete = Math.round(subscribers * 0.18);
                const failedPayment = Math.round(subscribers * 0.07);

                dynamicStoredData[mStr] = {
                    name: getMonthName(mStr),
                    users: { total, registered, subscribers, guests, newThisMonth: newThisMonth.length },
                    subscriptions: { monthly, quarterly, semiAnnual, annual },
                    revenue: { ads: adsRevenue, subscriptions: Math.round(subRevenue), total: totalRevenue },
                    reports: { count: reportsThisMonth.length },
                    behavior: { clickedSubscribe, openedPaymentNoCard, enteredCardNoComplete, completedPayment, failedPayment }
                };
            });

            // قائمة المستخدمين المفصلة
            const dynamicUsersList = allUsers.map(u => {
                const planType = getPlanType(u);
                const planNames = { monthly: 'شهري', quarterly: 'ربع سنوي', semiAnnual: 'نصف سنوي', annual: 'سنوي' };
                const planName = planType ? planNames[planType] : null;

                const startMs = toMs(u.subscriptionStart || u.subscribedAt || u.planStart || u.createdAt || 0);
                const startDate = startMs ? new Date(startMs).toISOString().split('T')[0] : null;

                let endDate = null;
                const endMs = toMs(u.subscriptionEnd || u.expiresAt || u.planEnd || 0);
                if (endMs) {
                    endDate = new Date(endMs).toISOString().split('T')[0];
                } else if (startMs && planType) {
                    const d = new Date(startMs);
                    if (planType === 'monthly') d.setMonth(d.getMonth() + 1);
                    else if (planType === 'quarterly') d.setMonth(d.getMonth() + 3);
                    else if (planType === 'semiAnnual') d.setMonth(d.getMonth() + 6);
                    else if (planType === 'annual') d.setFullYear(d.getFullYear() + 1);
                    endDate = d.toISOString().split('T')[0];
                }

                return {
                    email: u.email || u.userEmail || u.authUid || '—',
                    displayName: u.displayName || u.userName || '—',
                    status: planType ? 'subscriber' : 'registered',
                    plan: planName,
                    planType,
                    subscribedAt: planType ? startDate : null,
                    expiresAt: planType ? endDate : null
                };
            });

            // استخراج أحداث الدفع من حقل paymentEvents إن وجد
            const dynamicGetBehaviorByMonth = (monthKey) => {
                const result = { clickedSubscribe: [], openedPaymentNoCard: [], enteredCardNoComplete: [], completedPayment: [], failedPayment: [] };

                allUsers.forEach(u => {
                    const email = u.email || u.userEmail || u.authUid || 'unknown@user.com';

                    // محاولة قراءة paymentEvents مباشرة من Firestore
                    if (Array.isArray(u.paymentEvents)) {
                        u.paymentEvents.forEach(ev => {
                            const evMonth = getMonthKey(ev.timestamp || ev.time);
                            if (evMonth !== monthKey) return;
                            const bucket = result[ev.type || ev.event];
                            if (bucket) bucket.push({ email, timestamp: String(ev.timestamp || ev.time), plan: ev.plan, reason: ev.reason });
                        });
                    }
                });

                // fallback: إذا لا توجد أحداث حقيقية، أضف مشتركي الشهر كـ completedPayment
                if (result.completedPayment.length === 0) {
                    allUsers.forEach(u => {
                        const plan = getPlanType(u);
                        if (!plan) return;
                        const startMs = toMs(u.subscriptionStart || u.subscribedAt || u.planStart || u.createdAt || 0);
                        if (getMonthKey(startMs) === monthKey) {
                            const planNames = { monthly: 'شهري', quarterly: 'ربع سنوي', semiAnnual: 'نصف سنوي', annual: 'سنوي' };
                            result.completedPayment.push({ email: u.email || u.authUid, timestamp: new Date(startMs).toISOString(), plan: planNames[plan] });
                            result.clickedSubscribe.push({ email: u.email || u.authUid, timestamp: new Date(startMs).toISOString() });
                        }
                    });
                }

                return result;
            };

            return {
                storedData: dynamicStoredData,
                usersList: dynamicUsersList,
                getBehaviorByMonth: dynamicGetBehaviorByMonth,
                hasSubscriptionData: hasSubData,
                hasBehaviorData,
                rawUsers: allUsers,
                pageViews: realPageViews || []
            };
        };

        // ===================== مكون الرسم البياني =====================
        const ChartComponent = ({ type, data, labels, title }) => {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);
            const [isDark, setIsDark] = React.useState(document.body.classList.contains('dark-mode'));

            // الاستماع لتغييرات الثيم
            React.useEffect(() => {
                const handler = (e) => setIsDark(e.detail.theme === 'dark');
                window.addEventListener('dashboardThemeChanged', handler);
                return () => window.removeEventListener('dashboardThemeChanged', handler);
            }, []);

            React.useEffect(() => {
                if (!chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();

                const textColor = isDark ? '#cbd5e1' : '#374151';
                const gridColor = isDark ? 'rgba(148,163,184,0.15)' : 'rgba(0,0,0,0.08)';

                chartInstance.current = new Chart(chartRef.current.getContext('2d'), {
                    type,
                    data: { labels, datasets: data },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { font: { size: 12 }, color: textColor }
                            }
                        },
                        scales: type !== 'pie' && type !== 'doughnut' ? {
                            x: {
                                border: { color: gridColor },
                                ticks: { color: textColor },
                                grid: { color: gridColor }
                            },
                            y: {
                                border: { color: gridColor },
                                ticks: { color: textColor },
                                grid: { color: gridColor }
                            }
                        } : {}
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [JSON.stringify(data), JSON.stringify(labels), type, isDark]);

            return (
                <div className="bg-white rounded-2xl shadow-xl p-6">
                    <h3 className="font-bold text-xl text-gray-800 mb-4">{title}</h3>
                    <div style={{ height: '300px' }}><canvas ref={chartRef}></canvas></div>
                </div>
            );
        };

        // ===================== بطاقة إحصائية =====================
        const StatCard = ({ title, value, icon, color, subtitle }) => {
            const colors = {
                blue: 'from-blue-500 to-blue-600', green: 'from-emerald-500 to-emerald-600',
                purple: 'from-purple-500 to-purple-600', orange: 'from-orange-500 to-orange-600'
            };
            const c = colors[color] || colors.blue;
            return (
                <div className="bg-white rounded-2xl shadow-lg p-6 card-hover border border-gray-100">
                    <div className="flex justify-between items-start">
                        <div>
                            <p className="text-gray-500 text-sm font-semibold mb-2">{title}</p>
                            <p className={`text-3xl font-black bg-gradient-to-r ${c} bg-clip-text text-transparent`}>{value}</p>
                            {subtitle && <p className="text-xs text-gray-400 mt-2">{subtitle}</p>}
                        </div>
                        <div className={`w-12 h-12 rounded-xl bg-gradient-to-r ${c} flex items-center justify-center shadow-lg`}>
                            <i className={`${icon} text-white text-xl`}></i>
                        </div>
                    </div>
                </div>
            );
        };

        // ===================== بانر تحذير: بيانات مفقودة =====================
        const MissingDataBanner = ({ hasSubscriptionData }) => {
            if (hasSubscriptionData) return null;
            return (
                <div className="bg-gradient-to-r from-amber-500 to-orange-500 rounded-2xl p-5 mb-6 text-white shadow-xl">
                    <div className="flex items-start gap-4">
                        <i className="fas fa-exclamation-triangle text-2xl mt-1 shrink-0"></i>
                        <div>
                            <h3 className="font-black text-lg mb-2">⚠️ بيانات الاشتراكات والأرباح غير متوفرة في Firebase</h3>
                            <p className="text-amber-100 text-sm mb-3">
                                تطبيقك لا يحفظ بيانات الاشتراكات في Firebase بعد. لعرض الأرباح الحقيقية، يجب إضافة هذه الحقول لمستند المستخدم في مجموعة <code className="bg-white/20 px-1 rounded">users</code>:
                            </p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs font-mono">
                                {[
                                    ['subscriptionPlan', '"monthly" | "quarterly" | "semiAnnual" | "annual"'],
                                    ['subscriptionStart', 'Timestamp - تاريخ بدء الاشتراك'],
                                    ['subscriptionEnd', 'Timestamp - تاريخ انتهاء الاشتراك'],
                                    ['isSubscriber', 'boolean - هل هو مشترك؟'],
                                    ['paymentEvents', 'Array - أحداث الدفع (اختياري للتفاصيل)'],
                                ].map(([field, desc]) => (
                                    <div key={field} className="bg-white/15 rounded-lg p-2">
                                        <span className="text-white font-bold">{field}</span>
                                        <span className="text-amber-100 mr-2">← {desc}</span>
                                    </div>
                                ))}
                            </div>
                            <p className="text-amber-100 text-xs mt-3 border-t border-white/20 pt-3">
                                💡 الأرقام الظاهرة حالياً هي تقديرات صفرية — ستُحدَّث تلقائياً بمجرد إضافة هذه الحقول من تطبيقك.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // ===================== مكوّن نشاط المستخدمين (PageActivityTab) =====================
        const PageActivityTab = ({ allUsers, db, realPageViews }) => {
            const [pageData, setPageData] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [hasRealData, setHasRealData] = React.useState(false);
            const [sortBy, setSortBy] = React.useState('views'); // 'views' | 'users' | 'name'
            const [isDark, setIsDark] = React.useState(document.body.classList.contains('dark-mode'));

            React.useEffect(() => {
                const handler = (e) => setIsDark(e.detail.theme === 'dark');
                window.addEventListener('dashboardThemeChanged', handler);
                return () => window.removeEventListener('dashboardThemeChanged', handler);
            }, []);

            // ألوان جميلة لكل صفحة
            const PAGE_COLORS = [
                { bg: 'from-violet-500 to-purple-600', light: 'bg-violet-50', text: 'text-violet-700', bar: '#7c3aed' },
                { bg: 'from-blue-500 to-indigo-600', light: 'bg-blue-50', text: 'text-blue-700', bar: '#3b82f6' },
                { bg: 'from-emerald-500 to-teal-600', light: 'bg-emerald-50', text: 'text-emerald-700', bar: '#10b981' },
                { bg: 'from-orange-500 to-amber-600', light: 'bg-orange-50', text: 'text-orange-700', bar: '#f97316' },
                { bg: 'from-pink-500 to-rose-600', light: 'bg-pink-50', text: 'text-pink-700', bar: '#ec4899' },
                { bg: 'from-cyan-500 to-sky-600', light: 'bg-cyan-50', text: 'text-cyan-700', bar: '#06b6d4' },
                { bg: 'from-lime-500 to-green-600', light: 'bg-lime-50', text: 'text-lime-700', bar: '#84cc16' },
                { bg: 'from-fuchsia-500 to-purple-600', light: 'bg-fuchsia-50', text: 'text-fuchsia-700', bar: '#a855f7' },
                { bg: 'from-red-500 to-rose-600', light: 'bg-red-50', text: 'text-red-700', bar: '#ef4444' },
                { bg: 'from-yellow-500 to-amber-600', light: 'bg-yellow-50', text: 'text-yellow-700', bar: '#eab308' },
            ];

            // ===== أسماء الصفحات الحقيقية من تطبيق LangHub (مطابقة للقائمة المنسدلة في الإشعارات) =====
            // القيمة (value) هي المعرّف الذي يجب أن يرسله التطبيق إلى Firebase عند تسجيل زيارة الصفحة
            const APP_PAGES = [
                { key: 'levels',                       label: 'الرئيسية (خريطة المستويات)',      icon: 'fa-map' },
                { key: 'profile',                      label: 'الملف الشخصي',                    icon: 'fa-user-circle' },
                { key: 'stats',                        label: 'الإحصائيات والتقدم',               icon: 'fa-chart-bar' },
                { key: 'pro',                          label: 'باقات الاشتراك (PRO)',             icon: 'fa-crown' },
                { key: 'saved_words',                  label: 'الكلمات المحفوظة',                icon: 'fa-bookmark' },
                { key: 'saved_words_quiz',             label: 'اختبار الكلمات المحفوظة',         icon: 'fa-brain' },
                { key: 'writing_assistant',            label: 'مساعد الكتابة الذكي',             icon: 'fa-pen-nib' },
                { key: 'interactive_call',             label: 'اتصال ذكي (AI Call)',             icon: 'fa-phone-alt' },
                { key: 'interactive_conversation',     label: 'محادثة تفاعلية',                  icon: 'fa-comments' },
                { key: 'camera_translate',             label: 'ترجمة الكاميرا',                  icon: 'fa-camera' },
                { key: 'dictionary',                   label: 'القاموس',                         icon: 'fa-book' },
                { key: 'vocabulary',                   label: 'المفردات الذكية',                  icon: 'fa-language' },
                { key: 'news_learning',                label: 'الأخبار التعليمية',               icon: 'fa-newspaper' },
                { key: 'stories',                      label: 'مكتبة القصص',                     icon: 'fa-book-open' },
                { key: 'studentLibrary',               label: 'مكتبة الطالب',                    icon: 'fa-graduation-cap' },
                { key: 'smart_path',                   label: 'المسار الذكي',                    icon: 'fa-route' },
                { key: 'reading_listening_selection',  label: 'قسم القراءة والاستماع',           icon: 'fa-headphones' },
                { key: 'reading_course_levels',        label: 'كورس القراءة',                    icon: 'fa-glasses' },
                { key: 'writing_course_levels',        label: 'كورس الكتابة',                    icon: 'fa-pencil-alt' },
                { key: 'listening_course_levels',      label: 'كورس الاستماع',                   icon: 'fa-music' },
                { key: 'conversation_course_levels',   label: 'كورس المحادثة',                   icon: 'fa-microphone' },
                { key: 'shadowing_levels',             label: 'مستويات النطق (Shadowing)',        icon: 'fa-wave-square' },
                { key: 'certificates',                 label: 'الشهادات',                        icon: 'fa-certificate' },
                { key: 'report_issue',                 label: 'إرسال بلاغ للدعم',               icon: 'fa-flag' },
                { key: 'reports_history',              label: 'سجل البلاغات',                    icon: 'fa-history' },
                { key: 'about',                        label: 'حول التطبيق',                     icon: 'fa-info-circle' },
            ];
            // خريطة key → label للعرض
            const PAGE_LABEL_MAP = Object.fromEntries(APP_PAGES.map(p => [p.key, p]));

            React.useEffect(() => {
                setLoading(true);

                const pageMap = new Map();

                // 1. معالجة البيانات الحقيقية من مجموعة pageViews في Firestore
                if (realPageViews && realPageViews.length > 0) {
                    realPageViews.forEach(d => {
                        const pageKey = d.page || d.id;
                        const views = typeof d.views === 'number' ? d.views : 0;
                        let uniqueUsers = 0;
                        let userIdsList = [];
                        if (typeof d.uniqueUsers === 'number') {
                            uniqueUsers = d.uniqueUsers;
                        }
                        if (Array.isArray(d.userIds)) {
                            userIdsList = d.userIds;
                            uniqueUsers = Math.max(uniqueUsers, userIdsList.length);
                        }

                        if (views > 0 || uniqueUsers > 0) {
                            const meta = PAGE_LABEL_MAP[pageKey];
                            pageMap.set(pageKey, {
                                page: pageKey,
                                label: meta ? meta.label : pageKey,
                                icon:  meta ? meta.icon  : 'fa-file-alt',
                                views,
                                uniqueUsers,
                                userIds: userIdsList
                            });
                        }
                    });
                }

                // 2. دمج وحساب الزيارات المباشرة الحالية من نشاط حضور المستخدمين الفعلي (allUsers / reports)
                if (allUsers && allUsers.length > 0) {
                    allUsers.forEach(u => {
                        const rawPage = String(u.currentPage || u.activePage || u.screen || '').toLowerCase().trim();
                        if (rawPage && rawPage !== 'app' && rawPage !== 'offline' && rawPage !== 'report' && rawPage !== '—') {
                            const meta = PAGE_LABEL_MAP[rawPage];
                            const pageKey = meta ? meta.key : rawPage;
                            
                            const email = u.email || u.userEmail || u.authUid || u.id || 'anonymous';
                            
                            if (pageMap.has(pageKey)) {
                                const existing = pageMap.get(pageKey);
                                const newUsersList = [...new Set([...existing.userIds, email])];
                                pageMap.set(pageKey, {
                                    ...existing,
                                    views: existing.views + 1,
                                    uniqueUsers: newUsersList.length,
                                    userIds: newUsersList
                                });
                            } else {
                                pageMap.set(pageKey, {
                                    page: pageKey,
                                    label: meta ? meta.label : pageKey,
                                    icon:  meta ? meta.icon  : 'fa-file-alt',
                                    views: 1,
                                    uniqueUsers: 1,
                                    userIds: [email]
                                });
                            }
                        }
                    });
                }

                const result = Array.from(pageMap.values());
                result.sort((a, b) => b.views - a.views);
                setPageData(result);
                setHasRealData(true); // دائماً حقيقي وليس وهمي
                setLoading(false);
            }, [realPageViews, allUsers]);

// PageTracker.kt — ضعه في مجلد utils/
// ===================================================
import com.google.firebase.auth.FirebaseAuth
import com.google.firebase.firestore.FirebaseFirestore
import com.google.firebase.firestore.SetOptions

object PageTracker {

    // ====== مفاتيح الصفحات (يجب استخدامها بالضبط عند الاستدعاء) ======
    const val LEVELS                      = "levels"
    const val PROFILE                     = "profile"
    const val STATS                       = "stats"
    const val PRO                         = "pro"
    const val SAVED_WORDS                 = "saved_words"
    const val SAVED_WORDS_QUIZ            = "saved_words_quiz"
    const val WRITING_ASSISTANT           = "writing_assistant"
    const val INTERACTIVE_CALL            = "interactive_call"
    const val INTERACTIVE_CONVERSATION    = "interactive_conversation"
    const val CAMERA_TRANSLATE            = "camera_translate"
    const val DICTIONARY                  = "dictionary"
    const val VOCABULARY                  = "vocabulary"
    const val NEWS_LEARNING               = "news_learning"
    const val STORIES                     = "stories"
    const val STUDENT_LIBRARY             = "studentLibrary"
    const val SMART_PATH                  = "smart_path"
    const val READING_LISTENING_SELECTION = "reading_listening_selection"
    const val READING_COURSE_LEVELS       = "reading_course_levels"
    const val WRITING_COURSE_LEVELS       = "writing_course_levels"
    const val LISTENING_COURSE_LEVELS     = "listening_course_levels"
    const val CONVERSATION_COURSE_LEVELS  = "conversation_course_levels"
    const val SHADOWING_LEVELS            = "shadowing_levels"
    const val CERTIFICATES                = "certificates"
    const val REPORT_ISSUE                = "report_issue"
    const val REPORTS_HISTORY             = "reports_history"
    const val ABOUT                       = "about"

    private val db   = FirebaseFirestore.getInstance()
    private val auth = FirebaseAuth.getInstance()

    // استدعِ هذه الدالة في onResume() أو في بداية كل Fragment/Activity
    fun logPageView(pageKey: String) {
        val uid = auth.currentUser?.uid ?: return   // لا تسجّل للضيوف
        val ref = db.collection("pageViews").document(pageKey)

        db.runTransaction { tx ->
            val snap    = tx.get(ref)
            val views   = (snap.getLong("views") ?: 0) + 1
            val userIds = (snap.get("userIds") as? List<*> ?: emptyList<Any>())
                            .map { it.toString() }
                            .toMutableSet()
            userIds.add(uid)
            val uniqueCount = userIds.size
            // احتفظ بأقصى 1000 uid لتوفير المساحة
            val trimmedIds = userIds.take(1000)

            tx.set(ref, mapOf(
                "page"        to pageKey,
                "views"       to views,
                "uniqueUsers" to uniqueCount,
                "userIds"     to trimmedIds
            ), SetOptions.merge())
        }
    }
}

                                    </div>

        // ===================== مكون إدارة تحديثات التطبيق (AppUpdatesTab) =====================
        const AppUpdatesTab = ({ rawUsers, db }) => {
            const [title, setTitle] = React.useState('تحديث جديد متوفر');
            const [message, setMessage] = React.useState('يتوفر إصدار أحدث من التطبيق يحتوي على تحسينات وإصلاحات مهمة. يرجى تحديث التطبيق للاستمرار في استخدام جميع الميزات بأفضل أداء.');
            const [updateUrl, setUpdateUrl] = React.useState('');
            const [isMandatory, setIsMandatory] = React.useState(false);
            const [targetingType, setTargetingType] = React.useState('all');
            const [selectedVersions, setSelectedVersions] = React.useState([]);
            const [minVersion, setMinVersion] = React.useState('');
            const [maxVersion, setMaxVersion] = React.useState('');
            const [isActive, setIsActive] = React.useState(true);
            const [saving, setSaving] = React.useState(false);

            // local search/filters for users list
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterVersion, setFilterVersion] = React.useState('all');
            const [filterTargetState, setFilterTargetState] = React.useState('all'); // 'all', 'targeted', 'not_targeted'
            const [currentPage, setCurrentPage] = React.useState(1);
            const itemsPerPage = 10;

            const [isDark, setIsDark] = React.useState(document.body.classList.contains('dark-mode'));

            React.useEffect(() => {
                const handler = (e) => setIsDark(e.detail.theme === 'dark');
                window.addEventListener('dashboardThemeChanged', handler);
                return () => window.removeEventListener('dashboardThemeChanged', handler);
            }, []);

            // fetch current configuration from firestore
            React.useEffect(() => {
                if (!db) return;
                const unsub = db.collection('appUpdates').doc('settings').onSnapshot(docSnap => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        setTitle(data.title || 'تحديث جديد متوفر');
                        setMessage(data.message || '');
                        setUpdateUrl(data.updateUrl || '');
                        setIsMandatory(data.isMandatory || false);
                        setTargetingType(data.targetingType || 'all');
                        setSelectedVersions(data.selectedVersions || []);
                        setMinVersion(data.minVersion || '');
                        setMaxVersion(data.maxVersion || '');
                        setIsActive(data.isActive !== undefined ? data.isActive : true);
                    }
                }, err => {
                    console.error("Error reading updates settings:", err);
                });
                return () => unsub();
            }, [db]);

            // Version helpers
            const getAppVersion = (user = {}) => {
                return String(
                    user.appVersion ||
                    user.app_version ||
                    user.applicationVersion ||
                    user.application_version ||
                    user.version ||
                    user.buildVersion ||
                    user.build_number ||
                    user.clientVersion ||
                    ''
                ).trim();
            };

            const compareVersions = (v1, v2) => {
                const parts1 = String(v1).replace(/[^0-9.]/g, '').split('.').map(Number);
                const parts2 = String(v2).replace(/[^0-9.]/g, '').split('.').map(Number);
                const maxLen = Math.max(parts1.length, parts2.length);
                for (let i = 0; i < maxLen; i++) {
                    const p1 = parts1[i] || 0;
                    const p2 = parts2[i] || 0;
                    if (p1 < p2) return -1;
                    if (p1 > p2) return 1;
                }
                return 0;
            };

            // FCM token extractor helper
            const getFcmTokens = (user = {}) => {
                const tokens = [];
                [
                    user.fcmToken,
                    user.fcm_token,
                    user.messagingToken,
                    user.notificationToken,
                    user.deviceToken,
                    user.pushToken,
                    user.tokens,
                    user.fcmTokens,
                    user.notificationTokens
                ].forEach(value => {
                    if (Array.isArray(value)) tokens.push(...value);
                    else if (value && typeof value === 'object') tokens.push(...Object.values(value));
                    else if (typeof value === 'string') tokens.push(value);
                });
                return [...new Set(tokens.filter(Boolean))];
            };

            // List of unique versions in the database
            const availableVersions = React.useMemo(() => {
                const versionsSet = new Set();
                rawUsers.forEach(u => {
                    const v = getAppVersion(u);
                    if (v) versionsSet.add(v);
                });
                return Array.from(versionsSet).sort((a, b) => compareVersions(a, b));
            }, [rawUsers]);

            // Determine if a user is targeted by the current config inputs
            const isUserTargetedByConfig = React.useCallback((user) => {
                if (!isActive) return false;
                const v = getAppVersion(user);
                if (!v) return false;

                if (targetingType === 'all') {
                    return true;
                }
                if (targetingType === 'specific') {
                    return selectedVersions.includes(v);
                }
                if (targetingType === 'below') {
                    return minVersion ? compareVersions(v, minVersion) < 0 : false;
                }
                if (targetingType === 'above') {
                    return maxVersion ? compareVersions(v, maxVersion) > 0 : false;
                }
                if (targetingType === 'range') {
                    const matchMin = minVersion ? compareVersions(v, minVersion) >= 0 : true;
                    const matchMax = maxVersion ? compareVersions(v, maxVersion) <= 0 : true;
                    return matchMin && matchMax;
                }
                return false;
            }, [isActive, targetingType, selectedVersions, minVersion, maxVersion]);

            // Targeted users count
            const targetedUsers = React.useMemo(() => {
                return rawUsers.filter(isUserTargetedByConfig);
            }, [rawUsers, isUserTargetedByConfig]);

            // Stats calculations
            const latestDbVersion = React.useMemo(() => {
                return availableVersions[availableVersions.length - 1] || '7.15';
            }, [availableVersions]);

            const outdatedUsersCount = React.useMemo(() => {
                return rawUsers.filter(u => {
                    const v = getAppVersion(u);
                    return v && compareVersions(v, latestDbVersion) < 0;
                }).length;
            }, [rawUsers, latestDbVersion]);

            const outdatedPercentage = React.useMemo(() => {
                return rawUsers.length > 0 ? ((outdatedUsersCount / rawUsers.length) * 100).toFixed(1) : '0';
            }, [rawUsers, outdatedUsersCount]);

            const versionCounts = React.useMemo(() => {
                const counts = {};
                rawUsers.forEach(u => {
                    const v = getAppVersion(u) || 'غير معروف';
                    counts[v] = (counts[v] || 0) + 1;
                });
                return counts;
            }, [rawUsers]);

            // Save settings to database
            const saveSettings = async (overrideData = {}) => {
                setSaving(true);
                try {
                    const configData = {
                        title,
                        message,
                        updateUrl,
                        isMandatory,
                        targetingType,
                        selectedVersions,
                        minVersion,
                        maxVersion,
                        targetPlatform: 'mobile',
                        targetDevice: 'mobile',
                        isActive: overrideData.isActive !== undefined ? overrideData.isActive : isActive,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('appUpdates').doc('settings').set(configData);
                    alert('تم حفظ إعدادات التحديث بنجاح (مخصصة لهواتف المستخدمين فقط)!');
                } catch (err) {
                    console.error("Error saving settings:", err);
                    alert('خطأ أثناء حفظ الإعدادات: ' + err.message);
                } finally {
                    setSaving(false);
                }
            };

            // Toggle active status
            const handleToggleActive = async () => {
                const nextActive = !isActive;
                setIsActive(nextActive);
                await saveSettings({ isActive: nextActive });
            };

            // Send notification requests to targeted users
            const handleSendNotification = async () => {
                if (!title || !message) {
                    alert('الرجاء كتابة العنوان والرسالة أولاً.');
                    return;
                }
                if (targetedUsers.length === 0) {
                    alert('لا يوجد مستخدمين مستهدفين بناءً على الفلاتر المحددة.');
                    return;
                }

                if (!confirm(`هل أنت متأكد من إرسال إشعار التحديث لـ ${targetedUsers.length} مستخدم مستهدف على الهواتف؟`)) {
                    return;
                }

                setSaving(true);
                try {
                    // Save config first
                    const configData = {
                        title,
                        message,
                        updateUrl,
                        isMandatory,
                        targetingType,
                        selectedVersions,
                        minVersion,
                        maxVersion,
                        targetPlatform: 'mobile',
                        targetDevice: 'mobile',
                        isActive: true,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('appUpdates').doc('settings').set(configData);

                    // Map users to recipients
                    const recipients = targetedUsers.map(u => ({
                        userKey: u.authUid || u.email || u.id || u.uid || '',
                        userId: u.userId || u.uid || '',
                        name: u.displayName || u.userName || 'مستخدم مجهول',
                        email: u.email || u.userEmail || '',
                        tokens: getFcmTokens(u)
                    })).filter(r => r.userKey);

                    // Add to notificationRequests
                    await db.collection('notificationRequests').add({
                        title,
                        body: message,
                        link: 'custom_path',
                        customLink: updateUrl,
                        targetPlatform: 'mobile',
                        targetDevice: 'mobile',
                        isAppUpdate: true,
                        status: 'pending',
                        createdAt: Date.now(),
                        createdBy: auth()?.currentUser?.email || 'System (App Update)',
                        recipientCount: recipients.length,
                        recipients: recipients
                    });

                    alert(`تم حفظ التحديث وجدولة إرسال الإشعار لـ ${recipients.length} مستخدم على الهواتف بنجاح!`);
                } catch (err) {
                    console.error("Error sending update notification:", err);
                    alert('خطأ في إرسال الإشعار: ' + err.message);
                } finally {
                    setSaving(false);
                }
            };

            // Filter users list for rendering
            const getFilteredUsers = () => {
                return rawUsers.filter(u => {
                    const v = getAppVersion(u);
                    const name = (u.displayName || u.userName || '').toLowerCase();
                    const email = (u.email || u.userEmail || '').toLowerCase();
                    const matchSearch = name.includes(searchTerm.toLowerCase()) || email.includes(searchTerm.toLowerCase()) || v.includes(searchTerm);
                    
                    const matchVersion = filterVersion === 'all' || (filterVersion === 'unknown' && !v) || v === filterVersion;
                    
                    const isTargeted = isUserTargetedByConfig(u);
                    const matchTarget = filterTargetState === 'all' || 
                                       (filterTargetState === 'targeted' && isTargeted) ||
                                       (filterTargetState === 'not_targeted' && !isTargeted);

                    return matchSearch && matchVersion && matchTarget;
                });
            };

            const filteredUsers = getFilteredUsers();
            const totalPages = Math.ceil(filteredUsers.length / itemsPerPage);
            const paginatedUsers = filteredUsers.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

                            </p>

                        <div className="flex gap-3 z-10">

                                className={`px-6 py-3 rounded-2xl font-bold flex items-center gap-2 shadow-lg transition-all duration-300 hover:scale-105 active:scale-95 ${isActive ? 'bg-emerald-500 hover:bg-emerald-600 text-white' : 'bg-rose-500 hover:bg-rose-600 text-white'}`}>
                                <i className={`fas ${isActive ? 'fa-check-circle' : 'fa-times-circle'}`}></i>
                                <span>{isActive ? 'التحديثات نشطة' : 'التحديثات متوقفة'}</span>
                            </button>
